# Shared analysis rules for every pure-Dart project in the monorepo
# (backend/ and packages/{common_models,api_contracts,validation,utilities}).
# Flutter projects (apps/*, packages/design_system) include
# analysis_options_flutter.yaml, which adds flutter_lints on top of the same rules.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - directives_ordering
    - sort_pub_dependencies
    - use_super_parameters
