name: backend
description: EazyClinic REST backend (Dart + Shelf). All business logic and privileged Firebase access live here.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  api_contracts:
    path: ../packages/api_contracts
  common_models:
    path: ../packages/common_models
  crypto: ^3.0.0
  dart_jsonwebtoken: ^3.2.0
  googleapis_auth: ^2.0.0
  http: ^1.2.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  utilities:
    path: ../packages/utilities
  validation:
    path: ../packages/validation

dev_dependencies:
  lints: ^5.0.0
  pointycastle: ^4.0.0
  test: ^1.24.0
